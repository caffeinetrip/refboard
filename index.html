<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' file: data:;">
  <title>RefBoard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="titlebar">
    <div id="tb-left">
      <button class="tb-btn" id="btn-new" title="New library (Ctrl+N)">New</button>
      <button class="tb-btn" id="btn-open" title="Open (Ctrl+O)">Open</button>
      <button class="tb-btn" id="btn-save" title="Save (Ctrl+S)">Save</button>
      <button class="tb-btn accent" id="btn-saveas" title="Save as (Ctrl+Shift+S)">Save As</button>
    </div>
    <div id="tb-center">
      <span id="project-name">Untitled</span>
    </div>
    <div id="tb-right">
      <button id="btn-min" class="win-btn" title="Minimize">-</button>
      <button id="btn-max" class="win-btn" title="Maximize">□</button>
      <button id="btn-close" class="win-btn close-btn" title="Close">x</button>
    </div>
  </div>

  <div id="app-shell">
    <aside id="sidebar">
      <nav id="main-nav">
        <button class="nav-btn" data-view="library">
          <span class="nav-ico">#</span>
          <span>Games</span>
        </button>
        <button class="nav-btn" data-view="daily-notes">
          <span class="nav-ico">N</span>
          <span>Notes</span>
        </button>
        <button class="nav-btn" data-view="photo-boards">
          <span class="nav-ico">P</span>
          <span>Photos</span>
        </button>
        <button class="nav-btn" data-view="projects">
          <span class="nav-ico">M</span>
          <span>My Projects</span>
        </button>
      </nav>

      <div class="side-section nav-subgroup">
        <div class="pane-label">Templates</div>
        <button class="nav-btn" data-view="templates">
          <span class="nav-ico">?</span>
          <span>Questions</span>
        </button>
      </div>

      <div class="side-section">
        <div class="pane-label">Recent</div>
        <div id="mini-game-list"></div>
      </div>
    </aside>

    <main id="main"></main>
  </div>

  <div id="playback-bar" class="hidden">
    <div id="timeline-row">
      <span id="t-current" class="t-time">0:00</span>
      <div id="timeline-track">
        <div id="tl-bg"></div>
        <div id="tl-fill"></div>
        <div id="tl-thumb"></div>
      </div>
      <span id="t-total" class="t-time">0:00</span>
    </div>

    <div id="pb-controls-row">
      <div id="pb-left">
        <button class="pb-btn" id="pb-prev" title="Previous frame / -1 sec">&lt;</button>
        <button class="pb-btn play-btn" id="pb-play" title="Play / Pause">Play</button>
        <button class="pb-btn" id="pb-next" title="Next frame / +1 sec">&gt;</button>
        <span id="frame-display">-</span>
        <button class="mode-btn" id="btn-mode" title="Frame mode">Player</button>
      </div>

      <div id="pb-center">
        <span class="pb-label">Speed</span>
        <div id="speed-btns">
          <button class="spd" data-v="0.1">0.1x</button>
          <button class="spd" data-v="0.25">0.25x</button>
          <button class="spd" data-v="0.5">0.5x</button>
          <button class="spd active" data-v="1">1x</button>
          <button class="spd" data-v="2">2x</button>
        </div>
      </div>

      <div id="pb-right">
        <button class="pb-btn" id="btn-mute" title="Sound">Sound</button>
        <input id="vol-slider" type="range" min="0" max="100" value="100" title="Volume">
      </div>
    </div>
  </div>

  <div id="modal-bg" class="hidden">
    <div id="modal-box">
      <div id="modal-title">New Game</div>
      <input id="modal-inp" type="text" spellcheck="false" autocomplete="off">
      <div id="modal-actions">
        <button class="mb-btn" id="modal-cancel">Cancel</button>
        <button class="mb-btn accent" id="modal-ok">Create</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <div id="loading-overlay" class="hidden">
    <div class="loading-content">
      <div class="loading-spinner"></div>
    <div class="loading-text">Loading...</div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
